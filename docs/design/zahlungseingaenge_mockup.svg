  <!-- Erklärungen für Babsi -->
  <g font-size="12" fill="#5b3fa0">
    <rect x="224" y="664" width="1032" height="180" rx="8" fill="#f5f0ff" stroke="#d7c8f5"/>
    <text x="240" y="690" font-weight="700" font-size="13">So läuft der Kontencheck</text>
    <text x="240" y="714">① Kontoauszug (Sparkasse / PayPal) daneben öffnen, ersten Eingang ansehen.</text>
    <text x="240" y="736">② Auftragsnummer, Namen oder einfach den Betrag ins Suchfeld tippen → meist bleibt genau eine Zeile übrig.</text>
    <text x="240" y="758">③ Betrag, Datum und Eingang sind schon ausgefüllt (Datum = heute, bei Bedarf auf das Valutadatum ändern) → Enter.</text>
    <text x="240" y="780">④ Die Zeile wird grün, 8 Sekunden lang ist „Rückgängig“ möglich. Danach gehen Zahlungsmail und Shop-Status raus – wie bisher im Auftrag.</text>
    <text x="240" y="802">⑤ Am Ende „Heute gebucht“ mit der Summe am Kontoauszug vergleichen. Stimmt beides überein, ist der Kontencheck fertig.</text>
    <text x="240" y="828" fill="#8a76b8" font-size="11">Nicht in der Liste: Kassen-Aufträge, Bar/Karte bei Abholung (zahlt man an der Kasse), PayPal-Bestellungen aus dem Shop (kommen bezahlt an), JTL-Archiv.</text>
  </g>
